# =============================================================
# AURA POS — Docker Compose Production
# =============================================================
# Usage:
#   cp .env.example .env.prod   (edit with real production values)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# IMPORTANT: Semua secret WAJIB diisi di .env.prod sebelum deploy.
# Jangan pernah commit file .env.prod ke repository.
# =============================================================

services:

  # ──────────────────────────────────────────
  # 1. PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aura_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aura_internal
    # ⚠️ Port TIDAK di-expose ke host — hanya accessible via internal network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────
  # 2. AURA POS Backend (FastAPI)
  # ──────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: aura_prod_backend
    restart: always
    command: >
      sh -c "python -m alembic upgrade head &&
             python scripts/seed_production.py &&
             python -m uvicorn app.main:app
               --host 0.0.0.0
               --port 8000
               --workers 4
               --proxy-headers
               --forwarded-allow-ips '*'
               --access-log"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - HERMES_API_URL=http://hermes_agent:8642
      - HERMES_API_SERVER_KEY=${HERMES_API_SERVER_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - EXTERNAL_EVENT_API_KEY=${EXTERNAL_EVENT_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_internal
      - aura_public
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"

  # ──────────────────────────────────────────
  # 3. MCP SSE Server (untuk Hermes Agent)
  # ──────────────────────────────────────────
  mcp_sse:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: aura_prod_mcp_sse
    restart: always
    command: "python -m app.mcp.server --transport sse"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REFRESH_TOKEN=${GOOGLE_REFRESH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aura_internal
    # ⚠️ Port TIDAK di-expose ke host — hanya Hermes yang perlu akses via internal network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/sse"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ──────────────────────────────────────────
  # 4. Hermes Agent (AI Reasoning Engine)
  # ──────────────────────────────────────────
  hermes_agent:
    image: nousresearch/hermes-agent:latest
    container_name: aura_prod_hermes_agent
    restart: always
    tty: true
    stdin_open: true
    command: ["gateway", "run"]
    environment:
      # Server Config
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_KEY=${HERMES_API_SERVER_KEY}

      # LLM Provider
      - LLM_API_KEY=${LLM_API_KEY}

      # MCP Connection (internal network)
      - MCP_SERVER_URL=http://mcp_sse:8001/sse

      # Agent Identity
      - SYSTEM_ROLE=OWNER

      # Dashboard (disable di production, atau aktifkan dengan credentials kuat)
      - HERMES_DASHBOARD=${HERMES_DASHBOARD_ENABLED:-false}
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME:-admin}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD}
    depends_on:
      - mcp_sse
    networks:
      - aura_internal
    # ⚠️ Port TIDAK di-expose ke host — Backend akses via internal network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"


# ──────────────────────────────────────────
# Networks
# ──────────────────────────────────────────
networks:
  # Internal network — service-to-service communication only
  aura_internal:
    driver: bridge
    internal: true

  # Public network — only backend exposed to host
  aura_public:
    driver: bridge


# ──────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
