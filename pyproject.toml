[project]
name = "aura-backend"
version = "0.1.0"
description = "AURA POS Backend - AI-Native Minimarket Operating & Decision Intelligence System"
readme = "README.md"
authors = [
    { name = "abyryn", email = "abirian755@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.28.1",
    "streamlit>=1.63.0",
    "requests>=2.34.2",
    "mcp>=2",
]

[project.scripts]
aura-backend = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", "tests/streamlit"]




